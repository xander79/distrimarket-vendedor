name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar Capacitor (copiar www/ al proyecto Android)
        run: npx cap sync android

      - name: Restaurar keystore de debug fijo (para firmar siempre igual)
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "android/debug.keystore" ]; then
            cp "android/debug.keystore" "$HOME/.android/debug.keystore"
          elif [ -f "debug.keystore" ]; then
            cp "debug.keystore" "$HOME/.android/debug.keystore"
          else
            echo "No se encontro debug.keystore (se busco en /android y en la raiz)"
            exit 1
          fi

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK como "Release" descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
